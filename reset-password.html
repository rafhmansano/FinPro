<!DOCTYPE html>
<html lang="pt-BR">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Redirecionando - FinPro</title>
    <style>
          body {
                  margin: 0;
                  padding: 0;
                  background: #020617;
                  color: #9a3b8;
                  font-family: system-ui, -apple-system, sans-serif;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 100vh;
          }
          .container {
                  text-align: center;
                  padding: 2rem;
          }
          .spinner {
                  width: 48px;
                  height: 48px;
                  border: 4px solid rgba(37, 99, 235, 0.1);
                  border-top-color: #2563eb;
                  border-radius: 50%;
                  animation: spin 1s linear infinite;
                  margin: 0 auto 1rem;
          }
          @keyframes spin {
                  to { transform: rotate(360deg); }
          }
          h1 {
                  color: #fff;
                  font-size: 1.5rem;
                  margin-bottom: 0.5rem;
          }
          p {
                  margin: 0.5rem 0;
          }
        </style>
  </head>
  <body>
      <div class="container">
            <div class="spinner"></div>div>
            <h1>Redirecionando...</h1>
          <p>Aguarde enquanto preparamos tudo para você</p>
      </div>div>
  
    <script>
          // Captura todos os parâmetros do hash
          const hash = window.location.hash;

          // Redireciona para a aplicação FinPro com o hash preservado
          const newUrl = 'https://rafhmansano.github.io/FinPro/' + hash;

          console.log('Redirecionando de:', window.location.href);
          console.log('Para:', newUrl);

          // Aguarda 500ms para o usuário ver a mensagem, então redireciona
          setTimeout(() => {
                  window.location.href = newUrl;
          }, 500);
    </script>
  </body>
